<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TAM AGRICOLE">
<title>TAM AGRICOLE – Gestion commerciale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root {
  --bg-app: #ffffff;
  --bg-sidebar: #f7f6f3;
  --bg-hover: #f1f0ee;
  --bg-active: #efefed;
  --bg-input: #ffffff;

  --text-primary: #37352f;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9b9a97;

  --border-light: #e9e9e7;
  --border-medium: #d9d9d6;

  --accent: #2383e2;
  --accent-hover: #1a6fbf;
  --accent-bg: #e7f1fb;

  --red: #e03e3e;
  --red-bg: #fbe9e9;
  --green: #0f7b6c;
  --green-bg: #e6f3f1;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --header-h: 52px;
  --nav-h: 60px;
}

body.dark-mode {
  --bg-app: #191919;
  --bg-sidebar: #202020;
  --bg-hover: #2a2a2a;
  --bg-active: #303030;
  --bg-input: #252525;
  --text-primary: #e9e9e7;
  --text-secondary: #9b9a97;
  --text-tertiary: #6b6b6b;
  --border-light: #2f2f2f;
  --border-medium: #3a3a3a;
  --accent: #4a9eff;
  --accent-hover: #6bb0ff;
  --accent-bg: #1a2c3f;
  --green: #4ec9b0;
  --green-bg: #1a2e2a;
  --red: #ff6b6b;
  --red-bg: #2a1a1a;
}
body.dark-mode .logo-icon { background: #e9e9e7; color: #191919; }
body.dark-mode .btn-success { background: #e9e9e7; color: #191919; }
body.dark-mode .btn-success:hover:not(:disabled) { background: #fff; }
body.dark-mode .toast { background: #e9e9e7; color: #191919; }

html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: var(--bg-app);
  color: var(--text-primary);
  display: flex; flex-direction: column;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  font-size: 15px;
  transition: background 0.2s, color 0.2s;
}

/* ==================== HEADER ==================== */
.app-header {
  flex-shrink: 0;
  background: var(--bg-app);
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: flex; align-items: center;
  position: relative; z-index: 100;
  border-bottom: 1px solid var(--border-light);
}
.header-container {
  width: 100%; padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}

.btn-back {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  color: var(--text-primary);
  cursor: pointer;
  transition: background 0.12s;
  flex-shrink: 0;
  padding: 0;
}
.btn-back:hover { background: var(--bg-hover); }
.btn-back:active { background: var(--bg-active); }
.btn-back svg {
  width: 20px; height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn-back.visible { display: flex; }

.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.9rem; font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.1px;
  flex: 1;
  justify-content: flex-start;
  transition: opacity 0.2s;
}
.logo.with-back { justify-content: center; }
.logo-icon {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: var(--text-primary);
  color: #fff;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 700;
  flex-shrink: 0;
}

.btn-theme {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  color: var(--text-primary);
  cursor: pointer;
  transition: background 0.12s;
  flex-shrink: 0;
  padding: 0;
}
.btn-theme:hover { background: var(--bg-hover); }
.btn-theme:active { background: var(--bg-active); }
.btn-theme svg {
  width: 20px; height: 20px;
  fill: currentColor;
}

/* ==================== MAIN ==================== */
.app-main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(var(--nav-h) + var(--safe-bottom) + 24px);
  scrollbar-width: none; -ms-overflow-style: none;
  background: var(--bg-app);
}
.app-main::-webkit-scrollbar { display: none; }

.page { display: none; }
.page.active { display: block; }

/* ==================== TYPO ==================== */
h2 {
  font-size: 1.4rem; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 16px; letter-spacing: -0.4px;
}
h3 {
  font-size: 0.72rem; font-weight: 600;
  color: var(--text-secondary);
  margin: 20px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* ==================== BUTTONS ==================== */
.btn {
  border: none; border-radius: var(--radius-md);
  padding: 9px 14px; font-size: 0.88rem; font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px;
  transition: background 0.12s, border-color 0.12s, opacity 0.12s;
  letter-spacing: -0.1px;
  -webkit-user-select: none; user-select: none;
}
.btn:active:not(:disabled) { opacity: 0.7; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-success { background: var(--text-primary); color: #fff; }
.btn-success:hover:not(:disabled) { background: #000; }
.btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-medium); }
.btn-secondary:hover:not(:disabled) { background: var(--bg-hover); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--border-medium); }
.btn-danger:hover:not(:disabled) { background: var(--red-bg); }

.btn-large {
  padding: 12px 16px; font-size: 0.92rem;
  width: 100%; min-height: 46px;
  border-radius: var(--radius-md);
  justify-content: flex-start;
}
.btn-block { width: 100%; }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; min-height: 30px; border-radius: var(--radius-sm); font-weight: 500; }

/* ==================== HERO ==================== */
.hero {
  background: var(--bg-sidebar);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  margin-bottom: 20px;
}
.hero h2 { font-size: 1.6rem; margin-bottom: 4px; }
.hero p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px; }
.hero-buttons { display: flex; flex-direction: column; gap: 8px; }
.hero-buttons .btn {
  background: var(--bg-app);
  color: var(--text-primary);
  border: 1px solid var(--border-medium);
  font-weight: 500;
  text-align: left;
  font-size: 0.92rem;
}
.hero-buttons .btn:hover:not(:disabled) { background: var(--bg-hover); }

/* ==================== TOOLBAR / INPUTS ==================== */
.toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

.input-search, .input-date, .input-select,
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-md);
  font-size: 16px;
  outline: none;
  background: var(--bg-input);
  min-height: 38px;
  color: var(--text-primary);
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none; appearance: none;
  font-weight: 400;
}
.input-search:focus, .input-date:focus, .input-select:focus,
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
.input-search::placeholder { color: var(--text-tertiary); }

.input-select, .form-group select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='3'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 32px;
}
.input-search {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239b9a97' stroke-width='2.5' stroke-linecap='round'%3e%3ccircle cx='11' cy='11' r='7'/%3e%3cpath d='m21 21-4.35-4.35'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: 12px center;
  padding-left: 34px;
}
.toolbar .btn { width: 100%; }

/* ==================== LISTES ==================== */
.liste-clients {
  display: flex; flex-direction: column;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-app);
}
.client-card {
  background: var(--bg-app);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
  border-bottom: 1px solid var(--border-light);
  transition: background 0.12s;
}
.client-card:last-child { border-bottom: none; }
.client-card:hover { background: var(--bg-hover); }
.client-card.visite { background: var(--bg-sidebar); }
.client-card .client-name {
  font-weight: 600; font-size: 0.92rem;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; color: var(--text-primary);
}
.client-card .client-id {
  font-size: 0.72rem; color: var(--text-tertiary);
  font-family: 'SF Mono', 'Courier New', monospace;
  letter-spacing: 0.2px;
}
.client-card .client-meta { font-size: 0.78rem; color: var(--text-secondary); }
.client-card .client-actions { display: flex; gap: 6px; margin-top: 8px; }
.client-card .client-actions .btn { flex: 1; }

.visite-badge {
  background: var(--green-bg);
  color: var(--green);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.68rem; font-weight: 600;
}

/* ==================== HISTORIQUE ==================== */
.historique-scroll {
  background: var(--bg-app);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 16px;
}
.hist-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.85rem;
}
.hist-item:last-child { border-bottom: none; }
.hist-item .hist-date { color: var(--text-tertiary); font-size: 0.72rem; }
.hist-item .hist-label { font-weight: 500; color: var(--text-primary); font-size: 0.88rem; }
.hist-empty { text-align: center; color: var(--text-tertiary); padding: 24px 16px; font-size: 0.85rem; }

/* ==================== VENTES ==================== */
.vente-layout { display: flex; flex-direction: column; gap: 12px; }
.vente-clients, .vente-produits, .vente-form {
  background: var(--bg-app);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 14px;
}
.liste-clients-vente {
  max-height: 220px; overflow-y: auto;
  display: flex; flex-direction: column;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  margin-top: 8px;
}
.client-vente-item {
  padding: 10px 12px; cursor: pointer;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.88rem;
  transition: background 0.12s;
}
.client-vente-item:last-child { border-bottom: none; }
.client-vente-item:hover { background: var(--bg-hover); }
.client-vente-item.selected { background: var(--accent-bg); color: var(--accent); font-weight: 500; }

.produits-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px; max-height: 320px; overflow-y: auto;
  margin-top: 8px;
}
.produit-btn {
  background: var(--bg-app);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-md);
  padding: 10px 8px;
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--text-primary);
  text-align: center;
  min-height: 64px;
  display: flex; align-items: center; justify-content: center;
  line-height: 1.35;
  transition: all 0.12s; cursor: pointer;
}
.produit-btn:hover { background: var(--bg-hover); }
.produit-btn.selected { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 500; }

/* ==================== FORMS ==================== */
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block; font-size: 0.75rem;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text-secondary);
}
.form-group input[readonly] { background: var(--bg-sidebar); color: var(--text-secondary); }
.total-field {
  background: var(--accent-bg) !important;
  color: var(--accent) !important;
  font-weight: 600 !important;
  border-color: var(--accent) !important;
}

/* ==================== NAV ==================== */
.main-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--bg-app);
  border-top: 1px solid var(--border-light);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 200;
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}
.nav-btn {
  background: none; border: none;
  color: var(--text-secondary);
  font-size: 0.68rem; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  flex: 1; cursor: pointer; padding: 6px 4px;
  transition: color 0.12s;
}
.nav-btn:active { opacity: 0.6; }
.nav-btn.active { color: var(--text-primary); font-weight: 600; }
.nav-btn svg { width: 20px; height: 20px; fill: currentColor; transition: transform 0.15s; }
.nav-btn.active svg { transform: scale(1.05); }

/* ==================== MODAL ==================== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15, 15, 15, 0.4);
  z-index: 1000; align-items: flex-end; padding: 0;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-app);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-height: 90vh;
  display: flex; flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: var(--safe-bottom);
  border-top: 1px solid var(--border-light);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border-light);
}
.modal-header h3 {
  color: var(--text-primary);
  margin: 0; font-size: 0.98rem;
  font-weight: 600;
  text-transform: none;
}
.modal-close {
  background: none; border: none;
  color: var(--text-secondary);
  font-size: 1.1rem;
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.12s;
}
.modal-close:hover { background: var(--bg-hover); }
.modal-body {
  padding: 20px; overflow-y: auto; flex: 1;
  color: var(--text-primary);
  font-size: 0.88rem;
  line-height: 1.5;
}
.modal-footer {
  padding: 12px 20px;
  display: flex; gap: 8px;
  border-top: 1px solid var(--border-light);
}
.modal-footer .btn { flex: 1; }

/* ==================== TOAST ==================== */
.toast {
  position: fixed;
  top: calc(var(--safe-top) + var(--header-h) + 12px);
  left: 50%; transform: translateX(-50%) translateY(-10px);
  background: var(--text-primary);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-size: 0.84rem;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(15, 15, 15, 0.15);
  z-index: 9999;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  display: flex; align-items: center; gap: 8px;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }

/* ==================== PDF TEMPLATE ==================== */
#pdf-template {
  display: none; padding: 20px;
  color: #000; background: #fff;
  font-family: Arial, sans-serif;
}
#pdf-template h1 {
  text-align: center;
  color: #37352f;
  border-bottom: 2px solid #e9e9e7;
  padding-bottom: 12px;
  margin-bottom: 20px;
  font-size: 20px;
}
#pdf-template .info-row {
  display: flex; justify-content: space-between;
  margin-bottom: 10px; font-size: 13px;
  color: #6b6b6b;
}
#pdf-template table {
  width: 100%; border-collapse: collapse;
  margin-top: 20px; font-size: 12px;
}
#pdf-template th, #pdf-template td {
  border: 1px solid #e9e9e7;
  padding: 8px; text-align: left;
}
#pdf-template th { background: #f7f6f3; color: #37352f; font-weight: 600; }
#pdf-template .footer { margin-top: 40px; text-align: center; font-size: 11px; color: #9b9a97; }

/* ==================== CONTACTS ==================== */
.contact-list {
  display: flex; flex-direction: column;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-app);
}
.contact-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-light);
  display: flex; flex-direction: column; gap: 3px;
}
.contact-item:last-child { border-bottom: none; }
.contact-item .contact-nom {
  font-weight: 600; font-size: 0.92rem;
  display: flex; justify-content: space-between; align-items: center;
}
.contact-item .contact-date {
  font-size: 0.72rem; color: var(--text-tertiary);
  font-family: 'SF Mono', 'Courier New', monospace;
}
.contact-item .contact-note {
  font-size: 0.82rem; color: var(--text-secondary);
  background: var(--bg-sidebar);
  padding: 6px 10px; border-radius: var(--radius-sm);
  margin-top: 4px;
  white-space: pre-wrap; word-break: break-word;
}
.contact-item .contact-actions {
  display: flex; gap: 6px; margin-top: 6px;
}
.contact-item .contact-actions .btn { flex: 1; }

/* ==================== PRODUITS / INVENTAIRE ==================== */
.famille-section {
  margin-bottom: 18px;
}
.famille-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text-primary);
  cursor: pointer;
  user-select: none;
}
.famille-header .famille-count {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  font-weight: 500;
}
.famille-header .chevron {
  transition: transform 0.2s;
  font-size: 0.7rem;
  color: var(--text-tertiary);
}
.famille-header.collapsed .chevron { transform: rotate(-90deg); }
.famille-body {
  border: 1px solid var(--border-light);
  border-top: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  overflow: hidden;
  background: var(--bg-app);
}
.famille-body.collapsed { display: none; }

.produit-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.84rem;
}
.produit-item:last-child { border-bottom: none; }
.produit-item .produit-nom {
  font-weight: 500; color: var(--text-primary);
  font-size: 0.86rem;
  line-height: 1.35;
}
.produit-item .produit-details {
  display: flex; flex-wrap: wrap; gap: 6px 12px;
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-top: 2px;
}
.produit-item .produit-ref {
  font-family: 'SF Mono', 'Courier New', monospace;
  font-size: 0.68rem;
  color: var(--text-tertiary);
  letter-spacing: 0.2px;
}
.produit-item .badge-stock {
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 0.66rem;
  font-weight: 600;
}

function appliquerTheme(theme) {
  const body = document.body;
  const icon = document.getElementById('themeIcon');
  if (theme === 'dark') {
    body.classList.add('dark-mode');
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';

    icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/><circle cx="12" cy="12" r="3"/>';

  localStorage.setItem(STORAGE_KEYS.THEME, theme);
}

function basculerTheme() {
  const isDark = document.body.classList.contains('dark-mode');
  appliquerTheme(isDark ? 'light' : 'dark');
}

function initTheme() {
  const saved = localStorage.getItem(STORAGE_KEYS.THEME);
  if (saved === 'dark') appliquerTheme('dark');
  else if (saved === 'light') appliquerTheme('light');
  else {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

function formatDate(iso) { return iso ? new Date(iso).toLocaleDateString('fr-FR') : ''; }
function dateDuJour() { return new Date().toISOString().slice(0, 10); }
function formatMontant(n) { return new Intl.NumberFormat('fr-FR').format(n) + ' DH'; }
function formatNombre(n) {
  if (n === null || n === undefined) return '—';
  return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(n);

function normaliser(str) { return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function echapperHTML(str) { const div = document.createElement('div'); div.textContent = str == null ? '' : String(str); return div.innerHTML; }

function toast(message, type = 'success') {
  const el = document.getElementById('toast');
  const icon = type === 'error' ? '✕' : '✓';
  el.innerHTML = `<span>${icon}</span><span>${message}</span>`;

    clients = [...CLIENTS_INITIAUX]; visites = []; ventes = []; contacts = [];
  }
}

function sauvegarder() {
  localStorage.setItem(STORAGE_KEYS.CLIENTS, JSON.stringify(clients));
  localStorage.setItem(STORAGE_KEYS.VISITES, JSON.stringify(visites));
  localStorage.setItem(STORAGE_KEYS.VENTES, JSON.stringify(ventes));
  localStorage.setItem(STORAGE_KEYS.CONTACTS, JSON.stringify(contacts));
}

/* ==================== NAVIGATION ==================== */
function initNavigation() {
  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.dataset.page;
      if (!page) return;
      afficherPage(page);
    });
  });
  document.getElementById('btnBack').addEventListener('click', () => afficherPage('accueil'));
}

function afficherPage(pageId) {
  currentPage = pageId;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + pageId);
  if (page) page.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
  document.querySelector('.app-main').scrollTop = 0;

  const btnBack = document.getElementById('btnBack');
  const logo = document.getElementById('logoHeader');
  if (pageId === 'accueil') {
    btnBack.classList.remove('visible');
    logo.classList.remove('with-back');
  } else {
    btnBack.classList.add('visible');
    logo.classList.add('with-back');
  }

  if (pageId === 'visites')   { renderVisites(); renderHistoriqueVisites(); }
  if (pageId === 'contacts')  { renderContacts(); }
  if (pageId === 'produits')  { renderProduits(); }
  if (pageId === 'ventes')    { renderClientsVente(); resetVenteForm(); }
  if (pageId === 'clients')   { renderClientsGestion(); }
}

function estVisiteAujourdhui(clientId) {
  return visites.some(v => v.clientId === clientId && v.date && v.date.slice(0, 10) === dateDuJour());
}

/* ==================== PRODUITS / INVENTAIRE ==================== */
function renderProduits() {
  const container = document.getElementById('listeProduits');
  const search = normaliser(document.getElementById('searchProduits').value.trim());

  // Filtrer les produits si recherche
  let famillesFiltrees = INVENTAIRE.map(f => {
    if (!search) return f;
    const produits = f.produits.filter(p =>
      normaliser(p.nom).includes(search) || normaliser(p.ref).includes(search)
    );
    return { famille: f.famille, produits };
  }).filter(f => f.produits.length > 0);

  if (!famillesFiltrees.length) {
    container.innerHTML = '<p class="hist-empty">Aucun produit trouvé.</p>';
    return;
  }

  // Si recherche active, tout ouvrir
  if (search) {
    famillesFiltrees.forEach(f => famillesOuvertes[f.famille] = true);
  }

  container.innerHTML = famillesFiltrees.map(f => {
    const ouvert = famillesOuvertes[f.famille] !== false; // ouvert par défaut
    const nb = f.produits.length;
    return `
      <div class="famille-section">
        <div class="famille-header ${ouvert ? '' : 'collapsed'}" data-famille="${echapperHTML(f.famille)}">
          <span>${echapperHTML(f.famille)}</span>
          <span style="display:flex; align-items:center; gap:8px;">
            <span class="famille-count">${nb}</span>
            <span class="chevron">▼</span>
          </span>
        </div>
        <div class="famille-body ${ouvert ? '' : 'collapsed'}">
          ${f.produits.map(p => {
            const statut = p.qte === null ? 'Inconnu' : (p.qte < 0 ? 'Négatif' : (p.qte === 0 ? 'Zéro' : 'OK'));
            const badgeClass = statut === 'OK' ? 'badge-ok' : (statut === 'Négatif' ? 'badge-neg' : 'badge-zero');
            return `
              <div class="produit-item">
                <div class="produit-nom">${echapperHTML(p.nom)}</div>
                <div class="produit-details">
                  ${p.ref ? `<span class="produit-ref">${echapperHTML(p.ref)}</span>` : ''}
                  <span>Stock: <strong>${formatNombre(p.qte)}</strong></span>
                  <span>S.I: ${formatNombre(p.si)}</span>
                  <span class="badge-stock ${badgeClass}">${statut}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.famille-header').forEach(h => {
    h.addEventListener('click', () => {
      const fam = h.dataset.famille;
      famillesOuvertes[fam] = famillesOuvertes[fam] === false ? true : false;
      const body = h.nextElementSibling;
      h.classList.toggle('collapsed');
      body.classList.toggle('collapsed');
    });
  });
}

/* ==================== VISITES ==================== */
function renderVisites() {
  const search = normaliser(document.getElementById('searchVisites').value.trim());
  const filtreDate = document.getElementById('filtreDateVisites').value;
  const container = document.getElementById('listeVisites');

  let liste = clients.slice().sort((a, b) => a.nom.localeCompare(b.nom));
  if (search) liste = liste.filter(c => normaliser(c.nom).includes(search));

  if (filtreDate) {
    const idsVisitesDate = new Set(visites.filter(v => v.date && v.date.slice(0, 10) === filtreDate).map(v => v.clientId));
    liste = liste.filter(c => idsVisitesDate.has(c.id));
  }

  if (!liste.length) { container.innerHTML = '<p class="hist-empty">Aucun client.</p>'; return; }

  container.innerHTML = liste.map(c => {
    const visiteAujourdhui = estVisiteAujourdhui(c.id);
    const dernieres = visites.filter(v => v.clientId === c.id).sort((a, b) => new Date(b.date) - new Date(a.date));
    const derniere = dernieres[0];

    return `
      <div class="client-card ${visiteAujourdhui ? 'visite' : ''}">
        <div class="client-name">
          <span>${echapperHTML(c.nom)}</span>
          ${visiteAujourdhui ? '<span class="visite-badge">✓ Visitée</span>' : ''}
        </div>
        <div class="client-id">${echapperHTML(c.id)}</div>
        <div class="client-meta">${derniere ? 'Dernière : ' + formatDateHeure(derniere.date) : 'Aucune visite'}</div>
        <div class="client-actions">
          <button class="btn btn-secondary btn-sm" data-visite="${c.id}" ${visiteAujourdhui ? 'disabled' : ''}>
            ${visiteAujourdhui ? 'Déjà visité' : 'Marquer visite'}
          </button>
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-visite]').forEach(btn => {
    btn.addEventListener('click', () => enregistrerVisite(btn.dataset.visite));
  });
}

function enregistrerVisite(clientId) {
  const client = clients.find(c => c.id === clientId);
  if (!client || estVisiteAujourdhui(clientId)) return;

  ouvrirModale({
    titre: 'Confirmer la visite',
    corps: `
      <div style="padding: 4px 0;">
        <p style="font-size:0.86rem; color:var(--text-secondary); margin-bottom:14px;">Voulez-vous confirmer la visite pour :</p>
        <p style="font-size:1.05rem; font-weight:600; color:var(--text-primary); margin-bottom:4px;">
          ${echapperHTML(client.nom)}
        </p>
        <p style="font-size:0.74rem; color:var(--text-tertiary); font-family:'SF Mono',monospace; letter-spacing:0.3px; margin-bottom:16px;">${echapperHTML(client.id)}</p>
        <p style="font-size:0.82rem; color:var(--text-secondary); padding:8px 12px; background:var(--bg-sidebar); border-radius:6px; display:inline-block;">
          ${new Date().toLocaleDateString('fr-FR')} · ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}
        </p>
      </div>
    `,
    footer: `
      <button class="btn btn-secondary" id="modalAnnulerVisite">Annuler</button>
      <button class="btn btn-primary" id="modalConfirmerVisite">Confirmer la visite</button>
    `
  });

  document.getElementById('modalAnnulerVisite').addEventListener('click', fermerModale);
  document.getElementById('modalConfirmerVisite').addEventListener('click', () => {
    visites.push({
      id: 'V' + Date.now(),
      clientId: client.id,
      clientNom: client.nom,
      date: maintenant()
    });
    sauvegarder();
    fermerModale();
    renderVisites();
    renderHistoriqueVisites();
    toast('Visite confirmée');
  });
}

function renderHistoriqueVisites() {
  const container = document.getElementById('historiqueVisites');
  const filtreDate = document.getElementById('filtreDateVisites').value;
  let liste = visites.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (filtreDate) liste = liste.filter(v => v.date && v.date.slice(0, 10) === filtreDate);

  if (!liste.length) { container.innerHTML = '<p class="hist-empty">Aucune visite enregistrée.</p>'; return; }

  container.innerHTML = liste.map(v => `
    <div class="hist-item">
      <span class="hist-label">${echapperHTML(v.clientNom)}</span>
      <span class="hist-date">${formatDateHeure(v.date)}</span>
    </div>
  `).join('');
}

/* ==================== CONTACTS ==================== */
function renderContacts() {
  const search = normaliser(document.getElementById('searchContacts').value.trim());
  const filtreDate = document.getElementById('filtreDateContacts').value;
  const container = document.getElementById('listeContacts');

  let liste = contacts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (search) liste = liste.filter(c => normaliser(c.clientNom).includes(search));
  if (filtreDate) liste = liste.filter(c => c.date && c.date.slice(0, 10) === filtreDate);

  if (!liste.length) {
    container.innerHTML = '<p class="hist-empty">Aucun contact enregistré. Utilisez le bouton ci-dessous.</p>';
  } else {
    container.innerHTML = liste.map(c => `
      <div class="contact-item">
        <div class="contact-nom">
          <span>${echapperHTML(c.clientNom)}</span>
        </div>
        <div class="contact-date">${formatDateHeure(c.date)}</div>
        <div class="contact-note">${echapperHTML(c.note)}</div>
        <div class="contact-actions">
          <button class="btn btn-secondary btn-sm" data-modifier-contact="${c.id}">Modifier</button>
          <button class="btn btn-danger btn-sm" data-supprimer-contact="${c.id}">Supprimer</button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('[data-modifier-contact]').forEach(btn => {
      btn.addEventListener('click', () => ouvrirModaleModifierContact(btn.dataset.modifierContact));
    });
    container.querySelectorAll('[data-supprimer-contact]').forEach(btn => {
      btn.addEventListener('click', () => supprimerContact(btn.dataset.supprimerContact));
    });
  }

  const existingBtn = document.getElementById('btnAjouterContact');
  if (existingBtn) existingBtn.remove();

  const addBtn = document.createElement('button');
  addBtn.id = 'btnAjouterContact';
  addBtn.className = 'btn btn-primary btn-block';
  addBtn.style.marginTop = '16px';
  addBtn.textContent = '+ Ajouter un contact';
  addBtn.addEventListener('click', ouvrirModaleAjouterContact);
  container.after(addBtn);
}

function ouvrirModaleAjouterContact() {
  const options = clients.slice().sort((a,b) => a.nom.localeCompare(b.nom))
    .map(c => `<option value="${c.id}">${echapperHTML(c.nom)} (${echapperHTML(c.id)})</option>`).join('');

  ouvrirModale({
    titre: 'Nouveau contact téléphonique',
    corps: `
      <div class="form-group">
        <label>Client</label>
        <select id="contactClientSelect">${options}</select>
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="contactNote" rows="3" placeholder="Détails de l'appel…" style="resize:vertical;"></textarea>
      </div>
    `,
    footer: `
      <button class="btn btn-secondary" id="modalAnnulerContact">Annuler</button>
      <button class="btn btn-primary" id="modalValiderContact">Enregistrer</button>
    `
  });

  document.getElementById('modalAnnulerContact').addEventListener('click', fermerModale);
  document.getElementById('modalValiderContact').addEventListener('click', () => {
    const clientId = document.getElementById('contactClientSelect').value;
    const note = document.getElementById('contactNote').value.trim();
    const client = clients.find(c => c.id === clientId);
    if (!client) { toast('Sélectionnez un client', 'error'); return; }
    if (!note) { toast('Ajoutez une note', 'error'); return; }

    contacts.push({
      id: 'C' + Date.now(),
      clientId: client.id,
      clientNom: client.nom,
      note: note,
      date: maintenant()
    });
    sauvegarder();
    fermerModale();
    renderContacts();
    toast('Contact enregistré');
  });
}

function ouvrirModaleModifierContact(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;

  ouvrirModale({
    titre: 'Modifier le contact',
    corps: `
      <div class="form-group">
        <label>Note</label>
        <textarea id="modifContactNote" rows="3" style="resize:vertical;">${echapperHTML(contact.note)}</textarea>
      </div>
    `,
    footer: `
      <button class="btn btn-secondary" id="modalAnnulerModifContact">Annuler</button>
      <button class="btn btn-primary" id="modalValiderModifContact">Enregistrer</button>
    `
  });

  document.getElementById('modalAnnulerModifContact').addEventListener('click', fermerModale);
  document.getElementById('modalValiderModifContact').addEventListener('click', () => {
    const newNote = document.getElementById('modifContactNote').value.trim();
    if (!newNote) { toast('La note ne peut pas être vide', 'error'); return; }
    contact.note = newNote;
    sauvegarder();
    fermerModale();
    renderContacts();
    toast('Contact modifié');
  });
}

function supprimerContact(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;

  ouvrirModale({
    titre: 'Supprimer le contact',
    corps: `<p style="color:var(--text-primary);">Voulez-vous vraiment supprimer ce contact ?</p>`,
    footer: `
      <button class="btn btn-secondary" id="modalAnnulerSupprContact">Annuler</button>
      <button class="btn btn-danger" id="modalConfirmerSupprContact">Supprimer</button>
    `
  });

  document.getElementById('modalAnnulerSupprContact').addEventListener('click', fermerModale);
  document.getElementById('modalConfirmerSupprContact').addEventListener('click', () => {
    contacts = contacts.filter(c => c.id !== contactId);
    sauvegarder();
    fermerModale();
    renderContacts();
    toast('Contact supprimé');
  });
}

/* ==================== IMPRESSION RAPPORT CONTACTS ==================== */
function imprimerRapportContacts() {
  const search = normaliser(document.getElementById('searchContacts').value.trim());
  const filtreDate = document.getElementById('filtreDateContacts').value;

  let liste = contacts.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (search) liste = liste.filter(c => normaliser(c.clientNom).includes(search));
  if (filtreDate) liste = liste.filter(c => c.date && c.date.slice(0, 10) === filtreDate);

  if (!liste.length) { toast('Aucun contact à imprimer', 'error'); return; }

  document.getElementById('pdf-type').textContent = 'Rapport des Contacts Téléphoniques';
  document.getElementById('pdf-date').textContent = formatDateHeure(maintenant());

  let filtreTexte = 'Tous les contacts';
  if (filtreDate) filtreTexte = `Date: ${formatDate(filtreDate)}`;
  if (search) filtreTexte += (filtreDate ? ' · ' : '') + `Recherche: "${document.getElementById('searchContacts').value}"`;
  document.getElementById('pdf-client').textContent = filtreTexte;

  document.getElementById('pdf-table').innerHTML = `
    <thead>
      <tr>
        <th style="width:30%;">Client</th>
        <th style="width:22%;">Date</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody>
      ${liste.map(c => `
        <tr>
          <td>${echapperHTML(c.clientNom)}</td>
          <td>${formatDateHeure(c.date)}</td>
          <td>${echapperHTML(c.note).replace(/\n/g, '<br>')}</td>
        </tr>
      `).join('')}
    </tbody>
  `;

  window.print();
}

/* ==================== VENTES ==================== */
function renderClientsVente() {
  const search = normaliser(document.getElementById('searchVenteClient').value.trim());
  const container = document.getElementById('listeClientsVente');
  let liste = clients.slice().sort((a, b) => a.nom.localeCompare(b.nom));
  if (search) liste = liste.filter(c => normaliser(c.nom).includes(search));

  if (!liste.length) { container.innerHTML = '<p class="hist-empty">Aucun client.</p>'; return; }

  container.innerHTML = liste.map(c => `
    <div class="client-vente-item ${venteState.clientId === c.id ? 'selected' : ''}" data-client-vente="${c.id}">
      ${echapperHTML(c.nom)} <span style="font-size:.7rem;color:var(--text-tertiary);">${echapperHTML(c.id)}</span>
    </div>
  `).join('');

  container.querySelectorAll('[data-client-vente]').forEach(el => {
    el.addEventListener('click', () => selectionnerClientVente(el.dataset.clientVente));
  });
}

function selectionnerClientVente(clientId) {
  venteState.clientId = clientId;
  venteState.produit = null;
  document.querySelectorAll('#listeClientsVente .client-vente-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.clientVente === clientId);
  });
  document.getElementById('venteProduits').style.display = 'block';
  renderProduitsVente();
  document.getElementById('venteForm').style.display = 'none';
  document.getElementById('venteProduits').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderProduitsVente() {
  const grid = document.getElementById('produitsGrid');
  grid.innerHTML = PRODUITS.map(p => `
    <button type="button" class="produit-btn ${venteState.produit === p ? 'selected' : ''}" data-produit="${echapperHTML(p)}">
      ${echapperHTML(p)}
    </button>
  `).join('');

  grid.querySelectorAll('[data-produit]').forEach(btn => {
    btn.addEventListener('click', () => selectionnerProduit(btn.dataset.produit));
  });
}

function selectionnerProduit(produit) {
  venteState.produit = produit;
  document.querySelectorAll('.produit-btn').forEach(b => b.classList.toggle('selected', b.dataset.produit === produit));

  document.getElementById('venteForm').style.display = 'block';
  document.getElementById('venteProduit').value = produit;
  document.getElementById('venteDate').value = dateDuJour();
  document.getElementById('venteQuantite').value = '';
  document.getElementById('ventePrix').value = '';
  document.getElementById('venteTotal').value = '';

  if (produit.includes('FILET') || produit.includes('OMBRIERE')) document.getElementById('venteUnite').value = 'M²';
  else if (produit.includes('AQUATAPE') || produit.includes('AQUADROP') || produit.includes('CINTAPE')) document.getElementById('venteUnite').value = 'ML';
  else if (produit.includes('FER') || produit.includes('CABLE') || produit.includes('PERLHUMS') || produit.includes('POWHUMUS')) document.getElementById('venteUnite').value = 'kg';
  else if (produit.includes('AGRAFES')) document.getElementById('venteUnite').value = 'Packet';

  document.getElementById('venteForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetVenteForm() {
  venteState.produit = null;
  document.getElementById('venteProduits').style.display = 'none';
  document.getElementById('venteForm').style.display = 'none';
}

function calculerTotalVente() {
  const q = parseFloat(document.getElementById('venteQuantite').value) || 0;
  const p = parseFloat(document.getElementById('ventePrix').value) || 0;
  document.getElementById('venteTotal').value = (q * p) > 0 ? formatMontant(q * p) : '';
}

function initVenteForm() {
  document.getElementById('venteQuantite').addEventListener('input', calculerTotalVente);
  document.getElementById('ventePrix').addEventListener('input', calculerTotalVente);
  document.getElementById('formVente').addEventListener('submit', e => {
    e.preventDefault();
    enregistrerVente();
  });
}

function enregistrerVente() {
  const client = clients.find(c => c.id === venteState.clientId);
  if (!client || !venteState.produit) { toast('Sélection incomplète', 'error'); return; }

  const quantite = parseFloat(document.getElementById('venteQuantite').value);
  const prix = parseFloat(document.getElementById('ventePrix').value);
  const dateVente = document.getElementById('venteDate').value;

  if (!quantite || quantite <= 0 || !prix || prix <= 0 || !dateVente) { toast('Vérifiez les champs', 'error'); return; }

  ventes.push({
    id: 'S' + Date.now(),
    clientId: client.id, clientNom: client.nom,
    produit: venteState.produit,
    quantite: quantite,
    unite: document.getElementById('venteUnite').value,
    prixUnitaire: prix,
    montant: quantite * prix,
    date: dateVente + 'T' + new Date().toTimeString().slice(0, 8)
  });

  sauvegarder();
  toast('Vente enregistrée');
  resetVenteForm();
}

/* ==================== CLIENTS ==================== */
function renderClientsGestion() {
  const search = normaliser(document.getElementById('searchClients').value.trim());
  const container = document.getElementById('listeClientsGestion');
  let liste = clients.slice().sort((a, b) => a.nom.localeCompare(b.nom));
  if (search) liste = liste.filter(c => normaliser(c.nom).includes(search));

  if (!liste.length) { container.innerHTML = '<p class="hist-empty">Aucun client.</p>'; return; }

  container.innerHTML = liste.map(c => `
    <div class="client-card">
      <div class="client-name"><span>${echapperHTML(c.nom)}</span></div>
      <div class="client-id">${echapperHTML(c.id)}</div>
      <div class="client-actions">
        <button class="btn btn-secondary btn-sm" data-modifier="${c.id}">Modifier</button>
        <button class="btn btn-danger btn-sm" data-supprimer="${c.id}">Supprimer</button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('[data-modifier]').forEach(btn => btn.addEventListener('click', () => ouvrirModaleModifierClient(btn.dataset.modifier)));
  container.querySelectorAll('[data-supprimer]').forEach(btn => btn.addEventListener('click', () => supprimerClient(btn.dataset.supprimer)));
}

function ajouterClient(nom) {
  nom = nom.trim();
  if (!nom || clients.some(c => normaliser(c.nom) === normaliser(nom))) { toast('Nom invalide ou existant', 'error'); return false; }

  clients.push({ id: 'CLT' + Math.floor(1000 + Math.random() * 9000), nom });
  sauvegarder();
  renderClientsGestion();
  toast('Client ajouté');
  return true;
}

function modifierClient(id, nouveauNom) {
  const client = clients.find(c => c.id === id);
  if (!client || !nouveauNom.trim()) return false;

  client.nom = nouveauNom.trim();
  visites.forEach(v => { if (v.clientId === id) v.clientNom = nouveauNom.trim(); });
  ventes.forEach(v => { if (v.clientId === id) v.clientNom = nouveauNom.trim(); });
  contacts.forEach(c => { if (c.clientId === id) c.clientNom = nouveauNom.trim(); });

  sauvegarder();
  renderClientsGestion();
  toast('Client modifié');
  return true;
}

function supprimerClient(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;

  ouvrirModale({
    titre: 'Supprimer le client',
    corps: `<p style="color:var(--text-primary);">Voulez-vous vraiment supprimer <strong>${echapperHTML(client.nom)}</strong> ainsi que tout son historique de visites, ventes et contacts ? Cette action est irréversible.</p>`,
    footer: `<button class="btn btn-secondary" id="modalAnnuler">Annuler</button>
             <button class="btn btn-danger" id="modalConfirmerSuppr">Supprimer</button>`
  });

  document.getElementById('modalAnnuler').addEventListener('click', fermerModale);
  document.getElementById('modalConfirmerSuppr').addEventListener('click', () => {
    clients = clients.filter(c => c.id !== id);
    visites = visites.filter(v => v.clientId !== id);
    ventes  = ventes.filter(v => v.clientId !== id);
    contacts = contacts.filter(c => c.clientId !== id);
    sauvegarder();
    fermerModale();
    renderClientsGestion();
    toast('Client supprimé');
  });
}

function ouvrirModaleModifierClient(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;

  ouvrirModale({
    titre: 'Modifier le client',
    corps: `
      <div class="form-group">
        <label>Nom du client</label>
        <input type="text" id="modifClientNom" value="${echapperHTML(client.nom)}">
      </div>
    `,
    footer: `<button class="btn btn-secondary" id="modalAnnuler">Annuler</button>
             <button class="btn btn-primary" id="modalValiderModif">Enregistrer</button>`
  });

  document.getElementById('modalAnnuler').addEventListener('click', fermerModale);
  document.getElementById('modalValiderModif').addEventListener('click', () => {
    if (modifierClient(id, document.getElementById('modifClientNom').value)) fermerModale();
  });
}

/* ==================== MODAL ==================== */
function ouvrirModale({ titre, corps, footer }) {
  document.getElementById('modalTitle').innerHTML = titre || '';
  document.getElementById('modalBody').innerHTML = corps || '';
  document.getElementById('modalFooter').innerHTML = footer || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function fermerModale() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function initModale() {
  document.getElementById('modalClose').addEventListener('click', fermerModale);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) fermerModale();
  });
}

/* ==================== EXPORT CSV ==================== */
function exportCSV() {
  let csv = '\uFEFFTYPE;CLIENT;PRODUIT;QTE;UNITE;PRIX;MONTANT;DATE\n';
  ventes.forEach(v => { csv += `VENTE;${v.clientNom};${v.produit};${v.quantite};${v.unite};${v.prixUnitaire};${v.montant};${v.date}\n`; });
  visites.forEach(v => { csv += `VISITE;${v.clientNom};;;;;;${v.date}\n`; });
  contacts.forEach(c => { csv += `CONTACT;${c.clientNom};;;;;;${c.date} - ${c.note}\n`; });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `tam_export_${dateDuJour()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Export CSV réussi');
}

/* ==================== EXPORT PDF VISITES ==================== */
document.getElementById('btnExportVisitesPDF').addEventListener('click', () => {
  const filtreDate = document.getElementById('filtreDateVisites').value;
  let liste = visites.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

  if (filtreDate) {
    liste = liste.filter(v => v.date && v.date.slice(0, 10) === filtreDate);
    document.getElementById('pdf-client').textContent = `Date: ${formatDate(filtreDate)}`;
  } else {
    document.getElementById('pdf-client').textContent = 'Toutes les visites';
  }

  if (!liste.length) { toast('Aucune visite à exporter', 'error'); return; }

  document.getElementById('pdf-type').textContent = 'Rapport des Visites';
  document.getElementById('pdf-date').textContent = formatDateHeure(maintenant());

  document.getElementById('pdf-table').innerHTML = `
    <thead><tr><th>Client</th><th>Date et Heure</th></tr></thead>
    <tbody>${liste.map(v => `<tr><td>${echapperHTML(v.clientNom)}</td><td>${formatDateHeure(v.date)}</td></tr>`).join('')}</tbody>
  `;

  const element = document.getElementById('pdf-template');
  element.style.display = 'block';
  html2pdf().set({
    margin: 10,
    filename: `Visites_${dateDuJour()}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save().then(() => {
    element.style.display = 'none';
    toast('PDF téléchargé');
  });
});

/* ==================== INIT ==================== */
function initVisitesFiltres() {
  document.getElementById('searchVisites').addEventListener('input', renderVisites);
  document.getElementById('filtreDateVisites').addEventListener('change', () => { renderVisites(); renderHistoriqueVisites(); });
  document.getElementById('resetFiltreVisites').addEventListener('click', () => {
    document.getElementById('searchVisites').value = '';
    document.getElementById('filtreDateVisites').value = '';
    renderVisites();
    renderHistoriqueVisites();
  });
  document.getElementById('btnExportVisitesCSV').addEventListener('click', exportCSV);
}

function initContactsFiltres() {
  document.getElementById('searchContacts').addEventListener('input', renderContacts);
  document.getElementById('filtreDateContacts').addEventListener('change', renderContacts);
  document.getElementById('resetFiltreContacts').addEventListener('click', () => {
    document.getElementById('searchContacts').value = '';
    document.getElementById('filtreDateContacts').value = '';
    renderContacts();
  });
  document.getElementById('btnPrintContacts').addEventListener('click', imprimerRapportContacts);
}

function initProduitsFiltres() {
  document.getElementById('searchProduits').addEventListener('input', renderProduits);
}

function initClients() {
  document.getElementById('searchClients').addEventListener('input', renderClientsGestion);
  document.getElementById('btnAjouterClient').addEventListener('click', () => {
    ouvrirModale({
      titre: 'Nouveau client',
      corps: `<div class="form-group"><label>Nom du client</label><input type="text" id="nouveauClientNom" placeholder="Ex: Ferme Durand"></div>`,
      footer: `<button class="btn btn-secondary" id="modalAnnuler">Annuler</button><button class="btn btn-primary" id="modalAjouter">Ajouter</button>`
    });
    document.getElementById('modalAnnuler').addEventListener('click', fermerModale);
    document.getElementById('modalAjouter').addEventListener('click', () => {
      if (ajouterClient(document.getElementById('nouveauClientNom').value)) fermerModale();
    });
    setTimeout(() => document.getElementById('nouveauClientNom').focus(), 300);
  });
}

function initVentesRecherche() {
  document.getElementById('searchVenteClient').addEventListener('input', renderClientsVente);
}

function init() {
  initTheme();
  chargerDonnees();
  initNavigation(); initModale(); initVisitesFiltres();
  initContactsFiltres(); initProduitsFiltres();
  initVenteForm(); initClients(); initVentesRecherche();
  afficherPage('accueil');
}

document.addEventListener('DOMContentLoaded', init);
</script>
